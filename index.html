<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Smart City Camera</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
  video {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:1;
  }
  .city {
    position:fixed; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .model {
    font-size:55px;
    background:rgba(0,0,0,.45);
    padding:25px;
    border-radius:25px;
    text-align:center;
    color:white;
  }
  .title {
    position:fixed; top:15px; left:15px; right:15px; z-index:3;
    background:rgba(0,0,0,.65);
    color:white; padding:12px; border-radius:12px;
    text-align:center; font-size:18px;
  }
</style>
</head>
<body>

<div class="title">🏙️ المدينة الذكية بالكاميرا</div>

<video id="camera" autoplay playsinline></video>

<div class="city">
  <div class="model">
    🏢 🏠 🏭<br>
    ☀️ 🌬️ 🔋 🌱<br>
    Smart City
  </div>
</div>

<script>
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(function(stream) {
  document.getElementById("camera").srcObject = stream;
})
.catch(function(error) {
  alert("لم يتم تشغيل الكاميرا. تأكد من السماح للكاميرا.");
});
</script>

</body>
</html>

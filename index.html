<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيتي - مدينتي الذكية</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#fff}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.25}
.app{position:fixed;inset:0;z-index:2;padding:25px;color:#111}
h1{text-align:right;font-size:28px}
.alert{margin:auto;width:max-content;background:white;padding:10px 25px;border-radius:12px;color:#00a86b;box-shadow:0 0 10px #ddd;font-weight:bold}
.controls{position:absolute;left:40px;top:140px;display:flex;flex-direction:column;gap:14px}
button{background:white;border:1px solid #ddd;border-radius:14px;padding:15px 35px;font-size:18px;box-shadow:0 4px 12px #ddd}
.cards{position:absolute;right:40px;top:130px;display:flex;flex-direction:column;gap:14px}
.card{background:white;width:150px;height:105px;border-radius:18px;box-shadow:0 4px 14px #ddd;text-align:center;padding:12px}
.card .icon{font-size:28px}.num{font-size:24px;font-weight:bold;color:#555}
.scene{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);text-align:center}
.sun{position:absolute;left:-180px;top:-120px;font-size:120px;filter:drop-shadow(0 0 40px gold)}
.house{font-size:150px;filter:drop-shadow(0 10px 15px #aaa)}
.panels{font-size:35px;position:absolute;top:25px;left:70px;transform:rotate(-25deg)}
.line{width:520px;height:5px;background:#222;margin:auto}
.stats{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);display:flex;gap:25px}
.stat{background:white;border-radius:20px;padding:12px 28px;box-shadow:0 4px 14px #ddd;font-weight:bold}
</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>

<div class="app">
  <h1>🏙️ مدينتي الذكية</h1>
  <div class="alert">☀️ النهار - طاقة شمسية ممتازة!</div>

  <div class="controls">
    <button>🌙 الليل</button>
    <button>💨 الريح</button>
    <button>☀️ الشمس تلقائي</button>
    <button>⚡ إظهار الطاقة</button>
  </div>

  <div class="cards">
    <div class="card"><div class="icon">☀️</div><p>الطاقة الشمسية</p><div class="num">5.8 kW</div></div>
    <div class="card"><div class="icon">💨</div><p>طاقة الرياح</p><div class="num">2.0 kW</div></div>
    <div class="card"><div class="icon">🔋</div><p>البطارية</p><div class="num">78%</div></div>
    <div class="card"><div class="icon">🏠</div><p>استهلاك البيت</p><div class="num">2.1 kW</div></div>
  </div>

  <div class="scene">
    <div class="sun">☀️</div>
    <div class="panels">🔷🔷🔷</div>
    <div class="house">🏠</div>
    <div>بيتي 🏠</div>
    <div class="line"></div>
  </div>

  <div class="stats">
    <div class="stat">إجمالي الطاقة: 7.8 kW</div>
    <div class="stat">100% طاقة نظيفة</div>
    <div class="stat">المباني: 4</div>
  </div>
</div>

<script>
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
.then(stream=>document.getElementById("camera").srcObject=stream)
.catch(()=>alert("اسمح للكاميرا من المتصفح"));
</script>

</body>
</html>
